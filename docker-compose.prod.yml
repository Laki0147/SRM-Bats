# Production stack for a single Linux host: postgres + api + web.
# Bring up with:  docker compose -f docker-compose.prod.yml up -d --build
# Values come from ./.env (copy from .env.example). The dev docker-compose.yml
# (postgres-only) is left untouched.
name: srm-bats

services:
  postgres:
    image: postgres:16-alpine
    container_name: srm-bats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply migrations then seed, then exit 0. Reuses the API build
  # stage (has the Prisma CLI, tsx and the schema/migrations).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: build
    image: srm-bats-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "pnpm --filter @srm-bats/database db:deploy && pnpm --filter @srm-bats/database db:seed"
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    image: srm-bats-api
    container_name: srm-bats-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '3001:3001'
    volumes:
      - uploads_data:/app/apps/api/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        # NEXT_PUBLIC_* are baked into the image at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}
    image: srm-bats-web
    container_name: srm-bats-web
    restart: unless-stopped
    env_file: .env
    depends_on:
      api:
        condition: service_started
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  uploads_data:
